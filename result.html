<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken AI - Prediction Result</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            border-radius: 15px;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .result-box {
            padding: 20px;
            border-radius: 10px;
            background-color: #e9ecef;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card p-4">
            <h2 class="text-center">Prediction Result</h2>
            <div class="result-box">
                <h3><strong>Prediction:</strong> {{ result['prediction'] }}</h3>
                <p>Confidence: {{ result['confidence'] }}%</p>
            </div>
            <a href="/" class="btn btn-primary btn-block">Back to Upload</a>
        </div>
    </div>

</body>
</html>
